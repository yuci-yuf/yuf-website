name: Build & Deploy to TMD (cPanel via FTP)

# Builds the Next.js app on GitHub's runners (plenty of memory — no cPanel OOM)
# and uploads the runtime files to the TMD server over FTP. node_modules is NOT
# uploaded (too large for FTP) — it stays installed on the server. Passenger is
# reloaded by uploading a fresh tmp/restart.txt.

on:
  push:
    branches: [main] # ← change to your production branch if different
  workflow_dispatch: {} # allows manual runs from the Actions tab

concurrency:
  group: deploy-tmd
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # NEXT_PUBLIC_* values are baked into the bundle at build time, so they
        # must be present here (from GitHub Secrets). Server-only secrets
        # (Razorpay, Firebase admin, Resend, Google Sheets) are read at RUNTIME
        # and live in the server's .env.local — they are intentionally NOT here.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: npm run build

      - name: Stage files to upload
        # Copy only the files the server needs to RUN into ./deploy-out, then
        # drop the build cache (huge, not needed to serve) and add a restart
        # trigger. This staged folder is what gets FTP-mirrored.
        run: |
          mkdir -p deploy-out
          cp -r .next public server.js next.config.ts package.json package-lock.json deploy-out/
          rm -rf deploy-out/.next/cache
          mkdir -p deploy-out/tmp
          echo "restart $(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA}" > deploy-out/tmp/restart.txt

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # explicit FTPS on port 21; switch to "ftp" if TLS fails
          port: 21
          local-dir: ./deploy-out/
          # The dedicated FTP account's home IS the app folder
          # (/home/youthuni/repositories/yuf-website), so upload to its root.
          server-dir: ./
          # Keep the server's own state/config that we never build here.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
